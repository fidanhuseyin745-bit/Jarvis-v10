<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#04070d"/>
  <!-- dış halka -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffcc00" stroke-width="8" stroke-dasharray="60 30" opacity="0.5"/>
  <!-- orta halka -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffcc00" stroke-width="10" stroke-dasharray="40 20" opacity="0.8"/>
  <!-- iç halka -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="#ffcc00" stroke-width="6" opacity="0.6"/>
  <!-- derece işaretleri -->
  <g stroke="#ffcc00" stroke-width="4" opacity="0.4">
    <line x1="256" y1="40" x2="256" y2="64"/>
    <line x1="256" y1="448" x2="256" y2="472"/>
    <line x1="40" y1="256" x2="64" y2="256"/>
    <line x1="448" y1="256" x2="472" y2="256"/>
  </g>
  <!-- merkez çekirdek -->
  <circle cx="256" cy="256" r="34" fill="#ffcc00"/>
  <circle cx="256" cy="256" r="20" fill="#04070d"/>
  <circle cx="256" cy="256" r="10" fill="#ffcc00"/>
  <!-- parıltı -->
  <circle cx="256" cy="256" r="60" fill="none" stroke="#ffcc00" stroke-width="2" opacity="0.3"/>
</svg>
