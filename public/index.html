<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#04070d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JARVIS">
<meta name="description" content="JARVIS — yapay zeka + skill kütüphanesi kişisel asistan">
<title>JARVIS // v10</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/jarvis.svg">
<link rel="stylesheet" href="/css/jarvis.css">
</head>
<body>

<!-- JARVIS HUD arka planı -->
<canvas id="hud"></canvas>

<!-- Köşe çerçeveleri (Avengers ekran estetiği) -->
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<!-- Üst durum çubuğu -->
<header class="topbar">
  <div class="brand">J.A.R.V.I.S</div>
  <div class="status">
    <span id="aiState" class="pill pill-off">AI OFFLINE</span>
    <button class="panel-toggle" data-target="left">SKILL</button>
    <button class="panel-toggle" data-target="right">SYS</button>
    <span id="clock" class="clock">--:--:--</span>
  </div>
</header>

<!-- Yetenek paneli -->
<aside class="panel left" id="panel-left">
  <button class="panel-close" data-target="left">✕</button>
  <h3>SKILLS</h3>
  <ul id="skillList" class="skill-list"></ul>
</aside>

<aside class="panel right" id="panel-right">
  <button class="panel-close" data-target="right">✕</button>
  <h3>SYSTEM</h3>
  <pre id="sysInfo" class="sys-info">yükleniyor…</pre>
</aside>

<!-- Merkezi sohbet -->
<main class="chat-wrap">
  <div id="log" class="log"></div>
  <form id="form" class="form">
    <input id="input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Komut girin… (ör: hava durumu istanbul)" autofocus>
    <button type="submit">GÖNDER</button>
  </form>
</main>

<script src="/js/hud.js"></script>
<script src="/js/app.js"></script>
<script>
  // Service Worker kaydı (PWA / offline)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch((e) => console.warn("SW kayıt hatası:", e));
    });
  }
  // Panel aç/kapa (mobil)
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-target]");
    if (!t) return;
    const p = document.getElementById("panel-" + t.dataset.target);
    if (p) p.classList.toggle("open");
  });
</script>
</body>
</html>
